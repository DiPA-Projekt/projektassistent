# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: GitHub CI - Code-Checks

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: Code-Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v2.1.5
        with:
          node-version: 14.x
          registry-url: "https://npm.pkg.github.com"
          scope: "@dipa-projekt"
      - name: Check via NPM
        run: |
          npm ci
          npm run format
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" == "develop" ]]; then
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="$GITHUB_SHA"
            echo "Running ESLint only for frontend files changed in develop push"
            mapfile -t changed_files < <(
              git -C "$GITHUB_WORKSPACE" diff --name-only "$BASE_SHA" "$HEAD_SHA" -- client/src client/tests |
              sed 's#^client/##' |
              grep -E '\.(html|js|json|jsx|ts|tsx|gql|graphql)$' || true
            )
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" == "feature/embed-tailoring-images-docx" ]]; then
            BASE_REF="develop"
            echo "Running ESLint only for frontend files changed against ${BASE_REF}"
            mapfile -t changed_files < <(
              git -C "$GITHUB_WORKSPACE" diff --name-only "origin/${BASE_REF}...HEAD" -- client/src client/tests |
              sed 's#^client/##' |
              grep -E '\.(html|js|json|jsx|ts|tsx|gql|graphql)$' || true
            )
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            BASE_REF="$GITHUB_BASE_REF"
            echo "Running ESLint only for frontend files changed against ${BASE_REF}"
            mapfile -t changed_files < <(
              git -C "$GITHUB_WORKSPACE" diff --name-only "origin/${BASE_REF}...HEAD" -- client/src client/tests |
              sed 's#^client/##' |
              grep -E '\.(html|js|json|jsx|ts|tsx|gql|graphql)$' || true
            )
          else
            echo "Running full ESLint check"
            npm run lint:eslint
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" && ( "$GITHUB_REF_NAME" == "develop" || "$GITHUB_REF_NAME" == "feature/embed-tailoring-images-docx" ) || "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            if (( ${#changed_files[@]} > 0 )); then
              printf 'ESLint: %s\n' "${changed_files[@]}"
              npx eslint "${changed_files[@]}"
            else
              echo "No changed frontend files to lint."
            fi
          fi
          npm run coverage
          npm run build
        working-directory: client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GIT_HUB_PACKAGES_ACCESS_TOKEN_WRITE }}
      - name: Set up JDK
        uses: actions/setup-java@v1
        with:
          java-version: 17
      - name: Check via MAVEN
        run: mvn clean install -s .mvn/settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_HUB_PACKAGES_ACCESS_TOKEN_WRITE }}
          GIT_HUB_USERNAME: ${{ secrets.GIT_HUB_USERNAME }}
          GIT_HUB_PACKAGES_ACCESS_TOKEN: ${{ secrets.GIT_HUB_PACKAGES_ACCESS_TOKEN_WRITE }}
          NODE_AUTH_TOKEN: ${{ secrets.GIT_HUB_PACKAGES_ACCESS_TOKEN_WRITE }}
